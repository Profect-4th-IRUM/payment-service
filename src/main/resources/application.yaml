spring:
  application:
    name: payment-service
  profiles:
    group:
      "local": "local, toss, default-datasource, default-db-management, default-redis, eureka, openfeign, actuator, kafka"
      "docker": "docker, toss, default-datasource, default-db-management, default-redis, eureka, openfeign, actuator, kafka"
      "prod": "prod, toss, prod-datasource, prod-db-management, prod-cache-redis, eureka, openfeign, actuator, kafka"
    active: ${PROFILE_ACTIVE:local}

  config:
    import:
      - optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

service:
  member:
    base_url: localhost:8081
  product:
    base_url: localhost:8082
  order:
    base_url: localhost:8083
  payment:
    base_url: localhost:8084
  ai:
    base-url: localhost:8085