spring:
  application:
    name: payment-service
  profiles:
    group:
      "local": "local, toss, default-datasource, default-redis, eureka, openfeign, actuator"
      "docker": "docker, toss, default-datasource, default-redis, eureka, openfeign, actuator"
      "prod": "prod, toss, prod-datasource, prod-cache-redis, eureka, openfeign, actuator"
    active: ${PROFILE_ACTIVE}

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}