databaseChangeLog:
  - changeSet:
      id: create-table-payment-outbox-1
      author: hyeonji91
      comment: "Outbox 패턴 처리를 위한 p_payment_outbox 테이블 생성"
      changes:
        - createTable:
            tableName: p_payment_outbox
            columns:
              - column:
                  name: payment_outbox_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                  remarks: "이벤트 타입 (예: failed, paid)"
              - column:
                  name: aggregate_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                  remarks: "도메인 (예: payment)"
              - column:
                  name: aggregate_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                  remarks: "Aggregate ID (예: payment_id)"
              - column:
                  name: payload
                  type: JSONB
                  constraints:
                    nullable: false
                  remarks: "이벤트 실제 데이터 (JSON)"
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: p_payment_outbox